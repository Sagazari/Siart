services:
  - type: web
    name: siart
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Chaves: preencha no painel do Render. Basta uma; quanto mais, mais opções de fallback.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false          # recomendado: senha de acesso ao site
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
    # Para os arquivos dos projetos sobreviverem a reinicializações e deploys,
    # use um plano pago e descomente o disco abaixo (o plano gratuito apaga o disco local):
    # disk:
    #   name: siart-data
    #   mountPath: /var/data
    #   sizeGB: 1
