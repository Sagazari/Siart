
name: Descompactar Siart

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar ZIP
        run: |
          mkdir -p temp
          unzip -o siart-fase1.zip -d temp

          if [ -d "temp/siart" ]; then
            cp -a temp/siart/. .
          else
            cp -a temp/. .
          fi

          rm -rf temp
          rm -f siart-fase1.zip

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Descompacta projeto Siart [skip ci]"
            git push
          fi
